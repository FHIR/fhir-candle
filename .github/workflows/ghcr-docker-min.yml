name: Publish minimal image on GitHub Container Registry

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-push-image:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/ghcr-docker.yml
    with:
      commit: ${{ inputs.commit }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish }}
      image_alias: minimal
      runtime_image: mcr.microsoft.com/dotnet/aspnet:11.0-resolute-chiseled-extra
