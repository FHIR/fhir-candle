name: Tests

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'fhirData/**'
    - 'fhir-candle.sln'
    - 'Dockerfile'
    - '.dockerignore'
    - 'changelog.md'
    - '.github/scripts/**'
    - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'fhirData/**'
    - 'fhir-candle.sln'
    - 'Dockerfile'
    - '.dockerignore'
    - 'changelog.md'
    - '.github/scripts/**'
    - '.github/workflows/**'
  workflow_call:
    inputs:
      commit_sha:
        description: Full source commit to build and test
        required: true
        type: string

permissions:
  contents: read

env:
  VSTEST_CONNECTION_TIMEOUT: '300'

jobs:
  build-and-test:
    name: build-and-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      if: ${{ inputs.commit_sha == '' }}

    - uses: actions/checkout@v7
      if: ${{ inputs.commit_sha != '' }}
      with:
        ref: ${{ inputs.commit_sha }}

    - name: Verify exact source commit
      if: ${{ inputs.commit_sha != '' }}
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ inputs.commit_sha }}
      run: |
        if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}\z')
        {
          throw 'Expected a full lowercase commit SHA.'
        }
        $actualCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
        {
          throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
        }

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            11.0.x
            10.0.x

    - name: Test release validators
      shell: pwsh
      run: ./.github/scripts/tests/Test-ReleaseScripts.ps1

    - name: Test theme adapter (Node.js 24+)
      shell: pwsh
      run: node --test .github/scripts/tests/candle-theme.test.cjs

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      id: build
      run: dotnet build --configuration Release --no-restore

    - name: Test .NET 11
      run: >-
        dotnet test --configuration Release --framework net11.0 --no-build --verbosity normal
        --logger trx --results-directory "${{ runner.temp }}/test-results/net11.0"

    - name: Test .NET 10
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: >-
        dotnet test --configuration Release --framework net10.0 --no-build --verbosity normal
        --logger trx --results-directory "${{ runner.temp }}/test-results/net10.0"

    - name: Upload test timings and results
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: ${{ runner.temp }}/test-results/**/*.trx
        if-no-files-found: error
        retention-days: 7
