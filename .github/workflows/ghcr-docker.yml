name: Publish on GitHub Container Registry

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      image_alias:
        default: latest
        type: string
      runtime_image:
        default: mcr.microsoft.com/dotnet/aspnet:11.0
        type: string

permissions:
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
    - name: Checkout the validated source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.commit }}

    - name: Revalidate container source and release
      id: source
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        PUBLISH: ${{ inputs.publish }}
        GH_TOKEN: ${{ github.token }}
      run: |
        $publishing = $env:PUBLISH -ceq 'true'
        if ($publishing -and ($env:GITHUB_EVENT_NAME -cne 'release' -or $env:GITHUB_SHA -cne $env:RELEASE_COMMIT))
        {
          throw 'Container publication requires the original published release commit.'
        }
        & ./.github/scripts/Test-ReleaseIdentity.ps1 `
          -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG `
          -ExpectedCommit $env:RELEASE_COMMIT -RequirePublishedRelease:$publishing
        Add-Content $env:GITHUB_OUTPUT "image=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())"

    - name: Log in to the container registry
      if: ${{ inputs.publish }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract deterministic Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.source.outputs.image }}
        labels: |
          org.opencontainers.image.title=fhir-candle
          org.opencontainers.image.description=A small in-memory FHIR server for testing and development - NOT for production workloads.
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ inputs.commit }}
        tags: |
          type=raw,value=${{ inputs.version }}${{ inputs.image_alias == 'minimal' && '-minimal' || '' }}
          type=raw,value=${{ inputs.image_alias }}

    - name: Set up QEMU for cross-platform builds
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build the tagged source for both platforms
      id: image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.publish }}
        build-args: |
          RUNTIME_IMAGE=${{ inputs.runtime_image }}
          RELEASE_VERSION=${{ inputs.version }}
          RELEASE_COMMIT=${{ inputs.commit }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Generate artifact attestation
      if: ${{ inputs.publish }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.source.outputs.image }}
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true
